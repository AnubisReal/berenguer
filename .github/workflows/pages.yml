name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_FACEBOOK_URL: ${{ vars.VITE_FACEBOOK_URL }}
          VITE_TIKTOK_URL: ${{ vars.VITE_TIKTOK_URL }}
          VITE_INSTAGRAM_URL: ${{ vars.VITE_INSTAGRAM_URL }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
